<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Serviflex - Autenticação</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-container" style="background-color: var(--bg-primary);">
    <div class="auth-card">
        <h2 style="margin-bottom: 1.5rem; text-align: center;">Acesso Corporativo</h2>
        <form action="admin.html" method="GET">
            <input type="email" placeholder="E-mail de Login" required>
            <input type="password" placeholder="Chave de Acesso" required>
            <button type="submit" class="btn-primary">Entrar no Dashboard</button>
        </form>
        <p style="margin-top: 1rem; text-align: center; font-size: 0.9rem;">Sua empresa não está listada? <a href="register.html">Inscrever-se</a></p>
    </div>
</body>
</html>
