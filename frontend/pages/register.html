<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"><title>Serviflex - Registro</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-container">
    <div class="auth-card">
        <h2 style="margin-bottom: 1rem;">Solicitar Acesso</h2>
        <form action="login.html">
            <input type="text" placeholder="Nome do Estabelecimento" required>
            <input type="email" placeholder="E-mail de Contato" required>
            <input type="password" placeholder="Definir Senha" required>
            <button type="submit" class="btn-primary">Finalizar Cadastro</button>
        </form>
    </div>
</body>
</html>
